<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Eren Dönmez</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <main class="admin-shell">

    <div id="loginView" class="admin-card" hidden>
      <p class="eyebrow">Yönetim</p>
      <h1>Giriş</h1>
      <p class="admin-lead">Supabase hesabınla oturum aç.</p>

      <form id="loginForm" class="admin-form">
        <label>
          E-posta
          <input type="email" id="email" name="email" required autocomplete="username">
        </label>
        <label>
          Şifre
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary" id="loginBtn">Giriş yap</button>
      </form>
      <p id="loginError" class="admin-msg error" role="alert" hidden></p>
    </div>

    <div id="panelView" class="admin-panel" hidden>
      <header class="admin-bar">
        <a href="../" class="brand" target="_self">eren<span>.</span>dönmez</a>
        <div class="admin-bar-actions">
          <span id="userEmail" class="admin-user"></span>
          <button type="button" class="btn ghost" id="logoutBtn">Çıkış</button>
        </div>
      </header>

      <section class="admin-card">
        <p class="eyebrow">Google Drive</p>
        <h2>Dosya yükle</h2>
        <p class="admin-lead">Seçtiğin dosya Edge Function üzerinden Drive klasörüne gider.</p>

        <form id="uploadForm" class="admin-form">
          <label class="file-drop" id="fileDrop">
            <input type="file" id="fileInput" required>
            <span id="fileLabel">Dosya seç veya sürükle</span>
          </label>
          <button type="submit" class="btn primary" id="uploadBtn">Yükle</button>
        </form>

        <p id="uploadMsg" class="admin-msg" hidden></p>
        <ul id="uploadLog" class="upload-log"></ul>
      </section>
    </div>

    <div id="configView" class="admin-card" hidden>
      <p class="eyebrow">Kurulum</p>
      <h1>Config eksik</h1>
      <p class="admin-lead">
        <code>admin/config.example.js</code> dosyasını
        <code>admin/config.js</code> olarak kopyala ve Supabase
        URL / anon key değerlerini doldur.
      </p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
